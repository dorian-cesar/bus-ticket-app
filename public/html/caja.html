<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Caja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #004ca6;
            --primary-dark: #003b84;
            --secondary: #f37b31;
            --error: #ef233c;
            --success: #4bb543;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --border: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-image: url('../img/fondo3.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            margin: 20px;
            animation: fadeIn 0.5s ease-out;
            color: white;
        }

        #saldoInicial {
            width: 100%;
            max-width: 250px;
            box-sizing: border-box;
            display: block;
            margin: 0 auto;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            color: white;
            position: relative;
            padding-bottom: 15px;
        }

        .logo h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--secondary);
            border-radius: 3px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
            color: white;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 500;
            color: white;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(243, 123, 49, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 76, 166, 0.3);
        }

        button:disabled {
            background-color: var(--gray);
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .button-group button {
            flex: 1;
        }

        .error-message,
        .success-message {
            font-size: 1rem;
            margin-top: 20px;
            text-align: center;
            min-height: 24px;
            padding: 12px;
            border-radius: 8px;
        }

        .error-message {
            background-color: rgba(239, 35, 60, 0.2);
            color: white;
        }

        .success-message {
            background-color: rgba(75, 181, 67, 0.2);
            color: white;
        }

        .saldo-form {
            margin-top: 30px;
            padding: 25px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: rgba(0, 76, 166, 0.3);
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-info,
        .ventas-info,
        .cierre-info {
            text-align: center;
            margin: 25px 0;
            padding: 20px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .status-info {
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: rgba(0, 76, 166, 0.3);
            color: white;
        }

        .ventas-info {
            background-color: rgb(255, 255, 255);
            color: black;
        }

        .cierre-info {
            background-color: rgba(239, 35, 60, 0.2);
            color: white;
        }

        .hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px;
            }

            .logo h1 {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
                margin: 15px;
            }

            .button-group {
                flex-direction: column;
                gap: 10px;
            }

            button {
                padding: 12px;
            }

            .logo h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <h1>Sistema de Caja</h1>
        </div>

        <div id="statusInfo" class="status-info hidden"></div>
        <div id="ventasInfo" class="ventas-info hidden"></div>
        <div id="cierreInfo" class="cierre-info hidden"></div>
        <div id="error" class="error-message hidden"></div>
        <div id="success" class="success-message hidden"></div>

        <div id="saldoForm" class="saldo-form hidden">
            <h2>Saldo inicial de caja</h2>
            <div class="form-group">
                <label for="saldoInicial">Ingrese el saldo inicial:</label>
                <input type="number" id="saldoInicial" min="0" placeholder="0" />
            </div>
            <button id="btnConfirmarSaldo">Confirmar</button>
        </div>

        <div class="button-group">
            <button id="btnAbrirCaja">Abrir Caja</button>
            <button id="btnVendido" disabled>Vendido</button>
        </div>

        <div class="button-group">
            <button id="btnCerrarCaja" disabled>Cerrar Caja</button>
            <button id="irACaja" disabled>Ir a Caja</button>
        </div>

        <div class="button-group">
            <button id="btnCerrarSesion">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function isTokenExpired(token) {
                if (!token) return true;
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    return payload.exp < Math.floor(Date.now() / 1000);
                } catch (e) {
                    return true;
                }
            }

            function showError(message) {
                const errorElement = document.getElementById('error');
                errorElement.textContent = message;
                errorElement.classList.remove('hidden');
                setTimeout(() => {
                    errorElement.textContent = '';
                    errorElement.classList.add('hidden');
                }, 5000);
            }

            function showSuccess(message) {
                const successElement = document.getElementById('success');
                successElement.textContent = message;
                successElement.classList.remove('hidden');
                setTimeout(() => {
                    successElement.textContent = '';
                    successElement.classList.add('hidden');
                }, 5000);
            }

            function showStatus(message) {
                const statusElement = document.getElementById('statusInfo');
                statusElement.textContent = message;
                statusElement.classList.remove('hidden');
            }

            function showVentas(message) {
                const ventasElement = document.getElementById('ventasInfo');
                ventasElement.innerHTML = message;
                ventasElement.classList.remove('hidden');
            }

            function showCierre(message) {
                const cierreElement = document.getElementById('cierreInfo');
                cierreElement.innerHTML = message;
                cierreElement.classList.remove('hidden');
            }

            function hideMessages() {
                document.getElementById('statusInfo').classList.add('hidden');
                document.getElementById('ventasInfo').classList.add('hidden');
                document.getElementById('cierreInfo').classList.add('hidden');
                document.getElementById('error').classList.add('hidden');
                document.getElementById('success').classList.add('hidden');
            }

            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleString('es-CL', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            function formatCurrency(amount) {
                return new Intl.NumberFormat('es-CL', {
                    style: 'currency',
                    currency: 'CLP'
                }).format(amount);
            }

            function logout() {
                if (localStorage.getItem('idCaja')) {
                    showError("Debes cerrar la caja antes de salir");
                    return;
                }

                const confirmar = confirm("¿Estás seguro de cerrar sesión?");
                if (!confirmar) return;

                localStorage.clear();
                window.location.href = '/index.html';
            }

            // Variables globales
            const token = localStorage.getItem('tokenSesion');
            const user = JSON.parse(localStorage.getItem('user'));
            const idCaja = localStorage.getItem('idCaja');

            // Verificación de sesión
            if (isTokenExpired(token)) {
                logout();
            } else {
                if (user) {
                    showStatus(`Bienvenido/a: ${user.name}`);
                    console.log("Usuario:", user.name, "-", user.email);
                }

                if (idCaja) {
                    console.log("Caja activa:", idCaja);
                    document.getElementById('btnAbrirCaja').disabled = true;
                    document.getElementById('btnCerrarCaja').disabled = false;
                    document.getElementById('irACaja').disabled = false;
                    document.getElementById('btnVendido').disabled = false;
                } else {
                    document.getElementById('btnAbrirCaja').disabled = false;
                    document.getElementById('btnCerrarCaja').disabled = true;
                    document.getElementById('irACaja').disabled = true;
                    document.getElementById('btnVendido').disabled = true;
                }
            }

            // Abrir formulario
            document.getElementById('btnAbrirCaja').addEventListener('click', () => {
                if (localStorage.getItem('idCaja')) {
                    showError('Ya hay una caja abierta');
                    return;
                }
                document.getElementById('saldoForm').classList.remove('hidden');
            });

            // Confirmar saldo y abrir caja
            document.getElementById('btnConfirmarSaldo').addEventListener('click', async () => {
                const input = document.getElementById('saldoInicial');
                const saldo = parseFloat(input.value);

                if (input.value === '' || isNaN(saldo) || saldo < 0) {
                    showError('Ingrese un saldo válido');
                    return;
                }

                document.getElementById('btnConfirmarSaldo').disabled = true;
                await abrirCaja(saldo);
                document.getElementById('saldoForm').classList.add('hidden');
                document.getElementById('btnConfirmarSaldo').disabled = false;
                input.value = '';
            });


            document.getElementById('btnVendido').addEventListener('click', async () => {
                const id = localStorage.getItem('idCaja');
                if (!id) {
                    showError('No hay una caja abierta');
                    return;
                }

                try {
                    const res = await fetch(`https://boletos.dev-wit.com/api/movimientos/caja/${id}`, {
                        headers: {
                            'Authorization': 'Bearer ' + token
                        }
                    });

                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.error || 'Error al obtener las ventas');
                    }

                    const movimientos = await res.json();

                    const ingresos = movimientos.filter(mov => mov.tipo === 'ingreso');

                    const totalEfectivo = ingresos
                        .filter(mov => mov.medioPago === 'efectivo')
                        .reduce((sum, mov) => sum + mov.monto, 0);

                    const totalTarjeta = ingresos
                        .filter(mov => mov.medioPago === 'tarjeta')
                        .reduce((sum, mov) => sum + mov.monto, 0);

                    const totalVendido = totalEfectivo + totalTarjeta;

                    showVentas(`
        <strong>Resumen de Ventas:</strong><br>
        Total Vendido: ${formatCurrency(totalVendido)}<br>
        - Efectivo: ${formatCurrency(totalEfectivo)}<br>
        - Tarjeta: ${formatCurrency(totalTarjeta)}<br>
        N° de Transacciones: ${ingresos.length}
    `);

                } catch (err) {
                    console.error(err);
                    showError(err.message);
                }

            });

            async function abrirCaja(saldoInicial = 0) {
                try {
                    const res = await fetch('https://boletos.dev-wit.com/api/cajas', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({
                            usuario: user.email,
                            saldoInicial
                        })
                    });

                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.error || 'Error al abrir la caja');
                    }

                    const data = await res.json();
                    localStorage.setItem('idCaja', data._id);
                    showStatus(`
                    Caja abierta,

                    Saldo inicial: ${formatCurrency(saldoInicial)}
                    Fecha: ${formatDate(data.fechaApertura)}
                `);

                    document.getElementById('btnAbrirCaja').disabled = true;
                    document.getElementById('btnCerrarCaja').disabled = false;
                    document.getElementById('irACaja').disabled = false;
                    document.getElementById('btnVendido').disabled = false;
                } catch (err) {
                    console.error(err);
                    showError(err.message);
                }
            }

            async function cerrarCaja() {
                const confirmar = confirm("Después de cerrar la caja no podrás ver lo vendido");

                if (!confirmar) {
                    return;
                }
                const id = localStorage.getItem('idCaja');
                if (!id) {
                    showError('No hay una caja abierta');
                    return;
                }

                try {
                    const res = await fetch(`https://boletos.dev-wit.com/api/cajas/${id}/cerrar`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'Bearer ' + token
                        }
                    });

                    if (!res.ok) {
                        const error = await res.json();
                        showError(error.error || 'Error al cerrar la caja, pero podrás abrir otra');
                        localStorage.removeItem('idCaja');

                        document.getElementById('btnAbrirCaja').disabled = false;
                        document.getElementById('btnCerrarCaja').disabled = true;
                        document.getElementById('irACaja').disabled = true;
                        document.getElementById('btnVendido').disabled = true;
                        return;
                    }

                    const data = await res.json();
                    localStorage.removeItem('idCaja');

                    showCierre(`
                    <strong>Caja cerrada con éxito</strong><br>
                    Fecha de cierre: ${formatDate(data.fechaCierre)}<br>
                    Saldo inicial: ${formatCurrency(data.saldoInicial)}
                `);

                    document.getElementById('btnAbrirCaja').disabled = false;
                    document.getElementById('btnCerrarCaja').disabled = true;
                    document.getElementById('irACaja').disabled = true;
                    document.getElementById('btnVendido').disabled = true;
                } catch (err) {
                    console.error(err);
                    showError('Error inesperado al cerrar la caja');
                    localStorage.removeItem('idCaja');
                    document.getElementById('btnAbrirCaja').disabled = false;
                    document.getElementById('btnCerrarCaja').disabled = true;
                    document.getElementById('irACaja').disabled = true;
                    document.getElementById('btnVendido').disabled = true;
                }
            }

            function redirigir() {
                if (!token || !user || !localStorage.getItem('idCaja')) {
                    showError("Faltan datos para continuar");
                    return;
                }
                window.location.href = '/app.html';
            }

            // Eventos
            document.getElementById('btnCerrarCaja').addEventListener('click', cerrarCaja);
            document.getElementById('irACaja').addEventListener('click', redirigir);
            document.getElementById('btnCerrarSesion').addEventListener('click', logout);

        });

    </script>
</body>

</html>
