<!DOCTYPE html>
<html>

<head>
  <title>Procesando Pago</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .spinner {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .btn-secondary {
      background: #aaa;
    }

    .payment-success,
    .payment-error {
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <div class="spinner"></div>
  <h2>Procesando tu pago...</h2>
  <p>Por favor no cierres esta ventana.</p>

  <script>
    async function main() {
      if (typeof tokenFromServer === "undefined" || !tokenFromServer) {
        mostrarError("No se recibió token de pago desde el servidor.");
        return;
      }

      try {
        const res = await fetch('/.netlify/functions/consultarPago', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: tokenFromServer })
        });

        const data = await res.json();

        if (!res.ok || data.status !== 1) {
          mostrarError("El pago no fue aprobado");
          return;
        }

        const pending = JSON.parse(localStorage.getItem('pendingPayment'));
        if (!pending || !pending.seats || !pending.serviceId || !pending.token) {
          mostrarError("No se encontraron datos de reserva para confirmar los asientos.");
          return;
        }

        let confirmados = 0;
        for (const s of pending.seats) {
          const response = await fetch(`https://boletos.dev-wit.com/api/seats/${pending.serviceId}/confirm`, {
            method: 'POST',
            headers: {
              Authorization: pending.token,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              seatNumber: s.seat,
              authCode: 'FLOW_OK',
              userId: 'usuario123'
            })
          });

          if (response.ok) confirmados++;
        }

        if (confirmados === pending.seats.length) {
          mostrarExito(data.commerceOrder);
          localStorage.removeItem('pendingPayment');
        } else {
          mostrarError("Error al confirmar todos los asientos");
        }

      } catch (err) {
        console.error("❌ Error procesando pago:", err);
        mostrarError("Error al procesar el pago.");
      }
    }

    function mostrarExito(orderId) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          tipo: 'pagoCompletado',
          token: tokenFromServer,
          status: paymentStatusFromServer || '1'
        }, '*');
      }

      setTimeout(() => window.close(), 3000);

      document.body.innerHTML = `
    <div class="payment-success">
      <h2>¡Pago exitoso!</h2>
      <p>Orden <strong>${orderId}</strong> confirmada.</p>
      <p>Recibirás un correo con los detalles.</p>
      <a href="/" class="btn">Volver al inicio</a>
    </div>
  `;
    }

    function mostrarError(msg) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          tipo: 'pagoCompletado',
          token: tokenFromServer || '',
          status: paymentStatusFromServer || '0'
        }, '*');
      }

      setTimeout(() => window.close(), 3000);

      document.body.innerHTML = `
    <div class="payment-error">
      <h2>❌ Error en el pago</h2>
      <p>${msg}</p>
      <a href="/" class="btn btn-secondary">Volver</a>
    </div>
  `;
    }


    window.addEventListener('DOMContentLoaded', main);
  </script>
</body>

</html>
