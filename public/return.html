<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Confirmación de pago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center; 
      text-align: center;
    }

    .spinner {
      border: 5px solid #ccc;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div>
    <h2>Esperando confirmacion de pago...</h2>
    <div class="spinner"></div>
    <p>Esta ventana se cerrara automaticamente.</p>
  </div>

  <script>
    try {
      // Puedes detectar si hay campos POST automáticamente así:
      const hasHistory = history.length > 1;
      const cameFrom = document.referrer;

      console.log('Referrer:', cameFrom);
      console.log('History length:', history.length);

      // Aquí puedes simular un postMessage o cierre si es una ventana emergente
      setTimeout(() => {
        if (window.opener) {
          window.close(); // cerrar ventana popup
        } else {
          console.log('No es ventana emergente');
        }
      }, 3000);
    } catch (error) {
      console.error('Error al ejecutar lógica de retorno:', error);
    }
  </script>
</body>

</html>
