<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <h1>Sistema</h1>
        </div>

        <h2>Iniciar Sesión</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Correo</label>
                <input type="email" id="username" placeholder="Ingresa tu correo" required />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-content">
                    <input type="password" id="password" class="password-input" placeholder="Ingresa tu contraseña" required />
                    <button type="button" class="password-toggle" id="togglePassword">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit">Ingresar</button>

            <div id="error" class="error-message"></div>
        </form>

        <div class="footer">
            ¿Olvidaste tu contraseña? <a href="#">Recuperar</a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
